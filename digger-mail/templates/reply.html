<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>Réponse Digger-Radio</title>
</head>

<body style="margin:0;padding:28px 16px;
             background:#ffffff;
             background:linear-gradient(180deg,#ffffff 0%,#fdf3e3 100%);
             font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
             color:#5a4632;font-size:16px;line-height:1.6;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td align="center">

<table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0"
       style="max-width:640px;width:100%;background:#ffffff;
              border-radius:14px;overflow:hidden;
              border:2px solid #cd7f32;
              box-shadow:0 6px 24px rgba(205,127,50,0.22);">

  <!-- Logo plein cadre -->
  <tr>
    <td align="center" style="padding:0;background:#ffffff;line-height:0;">
      <img src="cid:logo-digger-radio"
           alt="Digger-Radio"
           style="display:block;width:100%;max-width:640px;height:auto;
                  border:0;outline:none;text-decoration:none;">
    </td>
  </tr>

  <!-- Bandeau orange / bronze -->
  <tr>
    <td align="center"
        style="padding:22px 24px;
               background:#e6761b;
               background:linear-gradient(135deg,#ff8c1a 0%,#e6761b 45%,#b5651d 100%);
               color:#ffffff;">
      <h1 style="margin:0;font-size:24px;font-weight:700;letter-spacing:.5px;">
        Digger-Mail
      </h1>
      <p style="margin:5px 0 0 0;font-size:14px;color:#ffffff;">
        Votre guide et assistant en ligne
      </p>
    </td>
  </tr>

  <!-- Réponse générée par le LLM -->
  <tr>
    <td style="padding:28px 32px 20px 32px;">

      <div class="body">
        $body_html
      </div>

    </td>
  </tr>

  <!-- Signature -->
  <tr>
    <td align="center" style="padding:8px 32px 24px 32px;">

      <p style="margin:0 0 4px 0;">
        Bonne continuation,
      </p>

      <p style="margin:0;">
        L'équipe <strong style="color:#e6761b;">Digger-Radio</strong>
      </p>

    </td>
  </tr>

  <!-- Pied de page -->
  <tr>
    <td align="center"
        style="background:#f3e6d3;color:#8c6a3f;
               font-size:12px;padding:16px 24px;
               border-top:3px solid #b5651d;">
      Réponse automatique générée par un assistant IA de Digger-Mail.<br>
      Message envoyé depuis une adresse automatique — merci de ne pas répondre.
    </td>
  </tr>

</table>
</td></tr>
</table>

</body>
</html>
